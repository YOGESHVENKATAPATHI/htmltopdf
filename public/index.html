<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to PDF Converter</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #0F172A;
            --surface: #1E293B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #818CF8, #C084FC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .editor-container {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .editor-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-header h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            padding: 1.5rem;
            background-color: transparent;
            border: none;
            color: #E2E8F0;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            box-sizing: border-box;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #475569;
        }

        .controls {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            background-color: rgba(15, 23, 42, 0.3);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loader {
            display: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background-color: #10B981;
            color: white;
            border-radius: 8px;
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }

        .toast.show {
            transform: translateY(0);
        }

        .toast.error {
            background-color: #EF4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HTML to PDF</h1>
            <p class="subtitle">Convert your HTML code into a beautiful PDF instantly. Styles included.</p>
        </header>

        <div class="editor-container">
            <div class="editor-header" style="flex-wrap: wrap; gap: 1rem;">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    HTML Input
                </h2>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="filenameInput" style="font-size: 0.9rem; color: var(--text-muted);">Filename:</label>
                    <input type="text" id="filenameInput" placeholder="document.pdf" style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text-main); outline: none;">
                </div>
            </div>
            
            <textarea id="htmlInput" placeholder="Paste your HTML here...&#10;&#10;Example:&#10;<div style=&quot;background: #f0f0f0; padding: 20px; border-radius: 8px;&quot;>&#10;  <h1 style=&quot;color: #333;&quot;>Hello World</h1>&#10;  <p style=&quot;color: #666;&quot;>This is a test document.</p>&#10;</div>"></textarea>
            
            <div class="controls">
                <button id="convertBtn">
                    <span class="btn-text">Generate PDF</span>
                    <div class="loader"></div>
                    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">PDF generated successfully!</div>

    <script>
        const convertBtn = document.getElementById('convertBtn');
        const htmlInput = document.getElementById('htmlInput');
        const btnText = document.querySelector('.btn-text');
        const loader = document.querySelector('.loader');
        const icon = document.querySelector('.icon');
        const toast = document.getElementById('toast');

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = `toast show ${isError ? 'error' : ''}`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        convertBtn.addEventListener('click', () => {
            const html = htmlInput.value.trim();
            
            if (!html) {
                showToast('Please enter some HTML code', true);
                return;
            }

            const printFrame = document.createElement('iframe');
            printFrame.style.position = 'fixed';
            printFrame.style.right = '0';
            printFrame.style.bottom = '0';
            printFrame.style.width = '0';
            printFrame.style.height = '0';
            printFrame.style.border = '0';
            document.body.appendChild(printFrame);

            const frameDoc = printFrame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(html);
            frameDoc.write('<style>@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }</style>');
            frameDoc.close();

            let hasPrinted = false;

            const triggerPrint = () => {
                if (hasPrinted) return;
                hasPrinted = true;
                
                // Only clean up the iframe AFTER the print dialog is closed
                printFrame.contentWindow.onafterprint = () => {
                    if (document.body.contains(printFrame)) {
                        document.body.removeChild(printFrame);
                    }
                };

                printFrame.contentWindow.focus();
                printFrame.contentWindow.print();
                showToast('Print dialog opened successfully!');
            };

            printFrame.onload = triggerPrint;
            
            // Fallback
            setTimeout(triggerPrint, 2000);
        });
    </script>
</body>
</html>
